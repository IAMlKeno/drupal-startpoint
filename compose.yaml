networks:
  swc-network:
    driver: bridge

services:
  cms:
    container_name: swc_cms
    build:
      context: ./drupal
      dockerfile: cms.Dockerfile
    ports:
      - 80:80
    expose:
      - 80
    volumes:
    #  - ./drupal/files:/opt/drupal/web/sites/default/files
      - ./drupal/modules/custom:/opt/drupal/web/modules/custom
      - ./drupal/themes/custom:/opt/drupal/web/themes/custom
    #  - ./drupal/config/sync:/opt/drupal/config/sync
    networks:
      - swc-network
  db:
    container_name: swc_db
    image: arm64v8/mysql
    environment:
      MYSQL_DATABASE: 'swc_squatober'
      MYSQL_USER: 'admin'
      MYSQL_PASSWORD: 'password'
      MYSQL_ROOT_PASSWORD: 'password'
    expose:
      - 3306
    restart: always
    volumes:
      - ./data/database/data:/var/lib/mysql
    networks:
      - swc-network 
