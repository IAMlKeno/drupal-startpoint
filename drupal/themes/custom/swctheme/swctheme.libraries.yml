global:
  version: 1.0.0
  css:
    theme:
      css/swc.css: {}
  js:
    # ES module: never aggregate (concatenation breaks import specifiers).
    js/swc-app.js: { attributes: { type: module }, preprocess: false, minified: true }
  dependencies:
    - core/drupal
    - core/once
    - core/drupalSettings

# Kept so existing attach_library() calls and swctheme.theme keep resolving.
# Everything now lives in the single stylesheet above.
wod:
  version: 1.0.0
  dependencies:
    - swctheme/global

profile:
  version: 1.0.0
  dependencies:
    - swctheme/global


